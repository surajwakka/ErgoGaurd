services:
  - type: web
    name: ergoguard-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ergoguard-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: ergoguard-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ergoguard-db
          property: password
databases:
  - name: ergoguard-db
    plan: free
